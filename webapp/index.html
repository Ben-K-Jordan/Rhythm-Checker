<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2ecdd">
<meta name="description" content="Honest drum practice: all 40 rudiments judged hit by hit, a drum tuner voiced to real players, and timing analysis — on-device, offline, free.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RhythmChk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rhythm Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/tuner.css">
<link rel="stylesheet" href="css/rudiments.css">
<link rel="stylesheet" href="css/timing.css">
<link rel="stylesheet" href="css/calibrate.css">
<link rel="stylesheet" href="css/history.css">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1242x2688.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
</head>
<body>

<noscript>
  <p style="font: 700 15px/1.5 sans-serif; padding: 24px; text-align: center">
    Rhythm Checker needs JavaScript — it listens to your drums and measures every
    hit in real time, entirely on this device. Nothing is ever uploaded.
  </p>
</noscript>

<div id="start-overlay" class="poster">
  <div class="poster-dots red-dots" aria-hidden="true"></div>
  <div class="poster-dots blue-dots" aria-hidden="true"></div>
  <div class="poster-vu"><div class="vu" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <div class="poster-hazard" aria-hidden="true"></div>
  <div class="poster-masthead">
    <div class="mast-line">RHYTHM</div>
    <div class="mast-line checker">CHECKER</div>
  </div>
  <div class="poster-lineup">
    <div class="starburst" aria-hidden="true">
      <svg viewBox="0 0 100 100"><polygon points="50,2 60,26 86,18 74,42 98,50 74,58 86,82 60,74 50,98 40,74 14,82 26,58 2,50 26,42 14,18 40,26" fill="#e8b23a" stroke="#141210" stroke-width="2.5"/></svg>
      <div class="starburst-label">100%<br>HONEST</div>
    </div>
    <button class="bill bill-1" data-goto="rudiments">RUDIMENTS</button>
    <button class="bill bill-2"><span data-goto="tuner">TUNER</span> <b>·</b> <span data-goto="timing">TIMING</span></button>
    <button class="bill bill-2"><span data-goto="calibrate">CALIBRATE</span> <b>·</b> <span data-goto="history">HISTORY</span></button>
    <button class="bill bill-3"><span data-goto="settings">SETTINGS</span> <b>·</b> NOTHING UPLOADED, EVER</button>
  </div>
  <div class="poster-cta-row">
    <button id="start-btn" class="cta poster-cta">TAP TO START<span class="tri"></span></button>
  </div>
  <p id="start-error" class="poster-error"></p>
  <div class="poster-footer"><div class="barcode" aria-hidden="true"></div></div>
</div>

<div id="app" class="hidden">
  <header class="chrome">
    <div class="chrome-row">
      <div class="chrome-left">
        <button id="nav-back" class="chrome-btn hidden">&#8592; HOME</button>
        <button id="chrome-gear-left" class="gear-btn" title="settings" aria-label="settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141210" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="wordmark"><span>RHY/CHK</span>
        <div class="vu" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="chrome-right">
        <div class="meter" title="mic level"><div id="mic-level"></div></div>
      </div>
    </div>
    <div class="hazard" aria-hidden="true"></div>
  </header>

  <main>
    <section id="mode-home" class="mode"></section>
    <section id="mode-tuner" class="mode"></section>
    <section id="mode-rudiments" class="mode"></section>
    <section id="mode-timing" class="mode"></section>
    <section id="mode-calibrate" class="mode"></section>
    <section id="mode-history" class="mode"></section>
  </main>

  <div id="drawer-scrim" class="hidden"></div>
  <aside id="settings" class="hidden">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <h2>SETTINGS</h2>
      <button id="settings-close" aria-label="close">&#10005;</button>
    </div>
    <div class="drawer-hazard hazard" aria-hidden="true"></div>
    <div id="settings-body"></div>
  </aside>
</div>

<div id="mic-lost" class="overlay hidden" style="position:fixed;inset:0;z-index:50">
  <h1>Microphone lost</h1>
  <p id="mic-lost-reason" class="warn-text"></p>
  <button id="mic-lost-btn" class="cta">Tap to reconnect</button>
</div>

<footer><span id="diag" class="dim"></span></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
